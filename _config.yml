title: Universalismo
description: Biblioteca de estudos sobre consciência, espiritualidade, Jesus e história profunda da humanidade.
url: "https://azaton.github.io"
baseurl: "/universalismo"

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

color_scheme: dark
search_enabled: true
nav_sort: default
heading_anchors: true

aux_links:
  "Repositório no GitHub":
    - "https://github.com/Azaton/universalismo"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Voltar ao topo"
footer_content: "Projeto Universalismo — pesquisa comparativa, discernimento e desenvolvimento interior."

exclude:
  - tools
  - README.md
  - assets/README.md
  - node_modules
  # Bastidores editoriais de "A Pré-História Espiritual da Humanidade": ficam
  # publicados no repositório, mas fora do site (só capitulos/ vira página).
  - Livros/A-Pré-História-Espiritual-da-Humanidade/anexos
  - Livros/A-Pré-História-Espiritual-da-Humanidade/corpus-bibliografico
  - Livros/A-Pré-História-Espiritual-da-Humanidade/criterios-de-pronto-capitulo.md
  - Livros/A-Pré-História-Espiritual-da-Humanidade/decisoes-editoriais
  - Livros/A-Pré-História-Espiritual-da-Humanidade/estado-da-obra
  - Livros/A-Pré-História-Espiritual-da-Humanidade/fichas
  - Livros/A-Pré-História-Espiritual-da-Humanidade/fontes-capitulos
  - Livros/A-Pré-História-Espiritual-da-Humanidade/glossario
  - Livros/A-Pré-História-Espiritual-da-Humanidade/linha-do-tempo-multicamada.md
  - Livros/A-Pré-História-Espiritual-da-Humanidade/mapas
  - Livros/A-Pré-História-Espiritual-da-Humanidade/matrizes
  - Livros/A-Pré-História-Espiritual-da-Humanidade/planejamento
  - Livros/A-Pré-História-Espiritual-da-Humanidade/publicacao
