title: Universalismo
description: Biblioteca de estudos sobre consciência, espiritualidade, Jesus e história profunda da humanidade.
url: "https://azaton.github.io"
baseurl: "/universalismo"

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

color_scheme: dark
search_enabled: true
nav_sort: default
heading_anchors: true

aux_links:
  "Repositório no GitHub":
    - "https://github.com/Azaton/universalismo"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Voltar ao topo"
# footer_content está deprecado no Just the Docs; o texto do rodapé e o bloco
# de colaboração agora vivem em _includes/footer_custom.html.

exclude:
  - tools
  - README.md
  - assets/README.md
  # Os bastidores editoriais das obras (fichas, dossiês de fontes, matrizes,
  # decisões, glossários, rascunhos, linhas do tempo de pesquisa) não vivem
  # mais dentro de uc-osasco/. Ficam na camada local, fora do repositório
  # público, em ../doc/obras/<Obra>/. Aqui permanecem apenas capa, períodos,
  # capítulos e mapas navegáveis.